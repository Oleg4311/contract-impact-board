name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Версия в package.json должна совпадать с тегом
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: (cd dist && sha256sum contract-impact.mjs > SHA256SUMS)
      - name: Подтверждение происхождения (provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/contract-impact.mjs
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/contract-impact.mjs dist/SHA256SUMS
          --title "contract-impact $GITHUB_REF_NAME"
          --notes "CLI одним файлом: node contract-impact.mjs старая.yaml новая.yaml карта.yaml --fail-on broken. Проверка: sha256sum -c SHA256SUMS и gh attestation verify contract-impact.mjs --repo Oleg4311/contract-impact-board."
